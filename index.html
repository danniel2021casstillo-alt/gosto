.adm-dash .profit-row{border-bottom-color:rgba(242,214,143,.1)}
.adm-dash .profit-row .pr-name b{color:var(--ad-cream)}
.adm-dash .profit-row .pr-name span{color:rgba(246,233,208,.56)}
.adm-dash .profit-row .pr-val.pos{color:var(--ad-gold-2);text-shadow:0 0 14px rgba(242,214,143,.22)}
.adm-dash .profit-row .pr-val.neg{color:#E8B4AE}
.adm-dash .margin-bar{background:rgba(246,233,208,.1)}
.adm-dash .margin-bar i{background:linear-gradient(90deg,var(--ad-gold),var(--ad-gold-2));box-shadow:0 0 10px rgba(242,214,143,.45)}
.adm-dash .gate{color:var(--ad-cream)}
/* acceso al panel: misma atmósfera oscura y cálida */
.adm-gate{
  display:flex;flex-direction:column;min-height:100vh;
  background:linear-gradient(180deg,#2D070F 0%,#22050B 45%,#180308 100%);
}
.adm-gate .hdr{border-bottom-color:rgba(242,214,143,.18);box-shadow:0 1px 0 rgba(242,214,143,.1),0 6px 24px rgba(0,0,0,.35)}
.adm-gate .gate{
  position:relative;
  width:100%;max-width:420px;margin:clamp(28px,7vh,70px) auto;
  padding:clamp(24px,4vw,36px) clamp(20px,4vw,30px);
  background:
    radial-gradient(340px 180px at 80% 0%,rgba(242,214,143,.14),transparent 68%),
    linear-gradient(168deg,var(--ad-panel) 0%,var(--ad-panel-2) 100%);
  border:1px solid rgba(242,214,143,.24);border-radius:20px;
  box-shadow:0 24px 54px rgba(0,0,0,.5),0 0 50px rgba(242,214,143,.08),inset 0 1px 0 rgba(242,214,143,.16);
}
.adm-gate .gate::before{
  content:'';position:absolute;top:0;left:18%;right:18%;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(242,214,143,.7),transparent);
}
.adm-gate .gate h1{color:var(--ad-cream)}
.adm-gate .gate p{color:rgba(246,233,208,.66)}
.adm-gate .gate .lg{border-color:var(--ad-gold);box-shadow:0 0 0 5px rgba(208,162,71,.14),0 0 30px rgba(242,214,143,.3),0 10px 26px rgba(0,0,0,.5)}
.adm-gate .locked-note{color:#E9A9A1}
.adm-dash .btn.ghost{background:rgba(246,233,208,.06);color:var(--ad-cream);border-color:rgba(242,214,143,.24);box-shadow:none}
.adm-dash .btn.ghost:hover{background:rgba(246,233,208,.12);border-color:var(--ad-gold);color:var(--ad-cream);box-shadow:0 0 20px rgba(242,214,143,.14)}
.adm-dash .btn.gold{background:linear-gradient(135deg,#F0D395,var(--ad-gold));color:var(--ad-ink);border-color:#9C7128;box-shadow:0 6px 20px rgba(208,162,71,.32),0 0 26px rgba(242,214,143,.16),inset 0 1px 0 rgba(255,250,232,.55)}
.adm-dash .btn.gold:hover{box-shadow:0 10px 28px rgba(208,162,71,.42),0 0 34px rgba(242,214,143,.24),inset 0 1px 0 rgba(255,250,232,.65)}
.adm-dash .recipe-summary{background:linear-gradient(135deg,#5C3B12,#2A1709);color:var(--ad-gold-2);border:1px solid rgba(242,214,143,.24);box-shadow:0 0 26px rgba(242,214,143,.07),inset 0 1px 0 rgba(242,214,143,.1)}
.adm-dash .recipe-summary b{color:var(--ad-cream)}

/* móvil: barra inferior + menú lateral desplegable */
.adm-dash .adm-backdrop{display:none;position:fixed;inset:0;z-index:90;background:rgba(6,2,3,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.adm-dash .adm-backdrop.show{display:block}
.adm-dash .adm-bottomnav{display:none}
@media(max-width:1100px){
  .adm-dash .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .adm-dash .span-6,.adm-dash .span-7,.adm-dash .span-5{grid-column:span 12}
  .adm-dash .otable-wrap{display:none}
  .adm-dash .ocards{display:flex}
}
@media(max-width:1024px){
  .adm-dash .adm-side{
    width:min(84vw,300px);z-index:100;transform:translateX(-104%);
    transition:transform .3s var(--ease-out);box-shadow:20px 0 48px rgba(0,0,0,.55);
  }
  .adm-dash .adm-side.open{transform:none}
  .adm-dash .adm-main{margin-left:0}
  .adm-dash .adm-burger{display:grid}
  .adm-dash .adm-top{padding:13px 16px}
  .adm-dash .adm-title h1{font-size:1.35rem}
  .adm-dash .adm-content{padding:16px 14px calc(94px + env(safe-area-inset-bottom))}
  .adm-dash .adm-bottomnav{
    position:fixed;left:0;right:0;bottom:0;z-index:70;
    display:flex;align-items:stretch;justify-content:space-around;gap:2px;
    padding:7px 6px calc(7px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(242,214,143,.06),transparent 40%),var(--ad-side);
    border-top:1px solid rgba(242,214,143,.22);
    box-shadow:0 -14px 32px rgba(0,0,0,.5),0 -1px 0 rgba(242,214,143,.14),0 -10px 30px rgba(242,214,143,.06);
  }
  .adm-dash .adm-bottom-btn,.adm-dash .adm-bottom-more{
    flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    padding:4px 1px;border-radius:10px;color:rgba(246,233,208,.66);
    font-size:9px;font-weight:800;line-height:1.1;text-align:center;
    transition:color .2s,background .2s,box-shadow .2s;
  }
  .adm-dash .adm-bottom-btn svg,.adm-dash .adm-bottom-more svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .adm-dash .adm-bottom-btn span,.adm-dash .adm-bottom-more span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .adm-dash .adm-bottom-btn[aria-current="page"]{color:var(--ad-gold-2);background:radial-gradient(circle at 50% 120%,rgba(242,214,143,.22),rgba(242,214,143,.05) 70%);box-shadow:0 0 18px rgba(242,214,143,.12),inset 0 0 0 1px rgba(242,214,143,.16)}
  .adm-dash .adm-bottom-btn[aria-current="page"] svg{stroke:var(--ad-gold-2);filter:drop-shadow(0 0 6px rgba(242,214,143,.6))}
  .adm-dash .adm-bottom-more{color:var(--ad-cream)}
  .adm-dash .adm-bottom-more:active,.adm-dash .adm-bottom-btn:active{background:rgba(246,233,208,.08)}
}
@media(max-width:640px){
  .adm-dash .adm-top{gap:10px}
  .adm-dash .adm-kicker{display:none}
  .adm-dash .adm-title h1{font-size:1.22rem}
  .adm-dash .adm-top .livepill,.adm-dash .adm-open{display:none}
  .adm-dash .adm-top-actions .adm-icon{display:none}
  .adm-dash .gold-banner{flex-direction:column;align-items:flex-start;gap:18px;padding:20px 18px;border-radius:18px}
  .adm-dash .banner-copy,.adm-dash .banner-rings{flex:none;width:100%}
  .adm-dash .banner-rings{justify-content:space-between;gap:8px}
  .adm-dash .banner-ring{width:min(21vw,92px);padding:6px}

  .adm-dash .banner-ring b{font-size:.9rem}
  .adm-dash .kpis{gap:10px}
  .adm-dash .kpi{min-height:136px;padding:14px 14px 12px;border-radius:16px}
  .adm-dash .kpi .val{font-size:1.26rem}
  .adm-dash .kpi-ico{width:30px;height:30px}
  .adm-dash .kpi-ico svg{width:14px;height:14px}
  .adm-dash .dash-grid{gap:12px;margin-bottom:12px}
  .adm-dash .acard{border-radius:16px;margin-bottom:12px}
  .adm-dash .acard-h{padding:15px 15px}
  .adm-dash .acard-b{padding:15px}
  .adm-dash .formgrid{grid-template-columns:1fr}
  .adm-dash .hours-row{grid-template-columns:1fr 1fr}
  .adm-dash .inp,.adm-dash .pinp,.adm-dash .inv-qty{min-width:0;max-width:100%}
  .adm-dash .bars{height:190px;gap:7px;padding-inline:2px}
  .adm-dash .bar-col{max-width:64px}
  .adm-dash .bar-label{font-size:9.5px}
  .adm-dash .emp-row,.adm-dash .gasto-row{padding:10px 0}
  .adm-dash .emp-av{width:38px;height:38px}
  .adm-dash .emp-amt,.adm-dash .gasto-val{font-size:.92rem}
  .adm-dash .chart-x span{font-size:9.5px}
  .adm-dash .rrow{padding:11px 15px}
  .adm-dash .rrow .money{width:100%;text-align:right}
}
@media(max-width:520px){
  .adm-dash .banner-rings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));justify-items:center;gap:8px}
  .adm-dash .banner-ring{width:100%;max-width:116px}
}
@media(max-width:420px){
  .adm-dash .kpis{grid-template-columns:1fr}
  .adm-dash .kpi{min-height:128px}
  .adm-dash .banner-rings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));justify-items:center}
  .adm-dash .banner-ring{width:100%;max-width:116px}
  .adm-dash .bar-col{max-width:56px}
  .adm-dash .bar-label{font-size:9px}
}

/* reduced motion */
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important;
  }
  .hero-img{animation:none;transform:scale(1.02)}
}

const LOW_STOCK = 5;
const BASE_UNITS = ['g','ml','unidad'];
const roundQty = n => Math.round((Number(n) || 0) * 1000) / 1000;
const matNombre = m => String(m?.nombre ?? m?.name ?? '').slice(0,80) || 'Insumo';
const matUnidad = m => {
  const u = String(m?.unidad ?? m?.unit ?? 'unidad').toLowerCase().trim();
  return BASE_UNITS.includes(u) ? u : 'unidad';
};
const matPresCant = m => Math.max(0.001, Number(m?.presentacionCantidad ?? m?.presCant ?? 1) || 1);
const matPresPrecio = m => Math.max(0, Math.round(Number(m?.presentacionPrecio ?? m?.presPrecio ?? m?.price ?? 0) || 0));
const matCostoUnit = m => {
  const c = Number(m?.costoUnitario ?? m?.costo ?? NaN);
  if(Number.isFinite(c) && c > 0) return c;
  const pc = matPresCant(m);
  return pc > 0 ? matPresPrecio(m) / pc : 0;
};
const matStock = m => Math.max(0, roundQty(m?.stock ?? 0));
const matStockMin = m => Math.max(0, roundQty(m?.stockMinimo ?? 0));
const cleanMaterial = m => {
  const presentacionCantidad = matPresCant(m);
  const presentacionPrecio = matPresPrecio(m);
  const costoUnitario = Number.isFinite(Number(m?.costoUnitario)) && Number(m.costoUnitario) > 0
    ? Number(m.costoUnitario)
    : (presentacionCantidad > 0 ? presentacionPrecio / presentacionCantidad : 0);
  return {
    nombre: matNombre(m),
    unidad: matUnidad(m),
    presentacionCantidad,
    presentacionPrecio,
    costoUnitario,
    stock: matStock(m),
    stockMinimo: matStockMin(m),
    activo: m?.activo !== false,
  };
};
const cleanCompra = c => {
  const presentaciones = Math.max(0, Number(c?.presentaciones) || 0);
  const cantidadTotal = Math.max(0, Number(c?.cantidadTotal) || 0);
  const costoTotal = Math.max(0, Math.round(Number(c?.costoTotal) || 0));
  const costoUnitario = cantidadTotal > 0 ? costoTotal / cantidadTotal : Math.max(0, Number(c?.costoUnitario) || 0);
  let fecha = c?.fecha;
  try { fecha = fecha ? new Date(fecha).toISOString().slice(0,10) : new Date().toISOString().slice(0,10); } catch(e){ fecha = new Date().toISOString().slice(0,10); }
  return {
    fecha,
    materiaPrimaId: String(c?.materiaPrimaId ?? c?.materialId ?? '').slice(0,40),
    nombre: String(c?.nombre ?? '').slice(0,80),
    presentaciones,
    cantidadTotal,
    costoTotal,
    costoUnitario,
    proveedor: String(c?.proveedor ?? '').slice(0,80),
    creadoPor: String(c?.creadoPor ?? '').slice(0,80),
  };
};
const cleanGasto = g => {

/* Descuenta (o devuelve) unidades del stock al vender/cancelar.
   Los clientes y el vendedor solo pueden REDUCIR (ver reglas de Firestore);
   aumentar solo lo puede hacer el admin (panel o compra). */
async function adjustStockForOrder(items, sign){
  for(const item of (items||[])){
    const id = item.id; if(!id) continue;
    const q = Math.max(0, Number(item.qty) || 0); if(!q) continue;
    try{
      await Store.saveStock(id, { qty: Math.max(0, stockQty(id) + sign * q) });
    }catch(e){ console.warn('No se pudo ajustar el stock de', id, e); }
  }
  if(isAdmin && adminOK){ refreshInventory(); }
}
const recipeOf = id => {
  const p = prod(id);
  if(p && Array.isArray(p.receta)) return cleanRecipe(p.receta).filter(r => mat(r.materiaPrimaId));
  return cleanRecipe(stockOf(id).recipe).map(r => ({ materiaPrimaId:r.materiaPrimaId, nombre:r.nombre, unidad:r.unidad, cantidad:r.cantidad })).filter(r => mat(r.materiaPrimaId));
};
const recipeCost = id => recipeOf(id).reduce((s,r) => s + matCostoUnit(mat(r.materiaPrimaId)) * r.cantidad, 0);
function productProfit(id){
  const p = prod(id);
  const rec = recipeOf(id);
  const has = rec.length > 0;
  const calcCost = recipeCost(id);
  const cost = has ? calcCost : Math.max(0, Number(p?.costo) || 0);
  const price = p?.precio ?? p?.price ?? 0;
  const profit = price - cost;
  return { cost, profit, margin: price ? profit / price * 100 : 0, has };
}

function disponibilidad(){
  const now=new Date(new Date().toLocaleString('en-US',{timeZone:'America/Bogota'}));
  const keys=['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];
  const h=horario()[keys[now.getDay()]], minutes=now.getHours()*60+now.getMinutes();
  if(!h?.abierto) return {abierto:false,texto:'Hoy no abrimos',proxima:proximaApertura(now)};
  const [ah,am]=String(h.desde||'17:00').split(':').map(Number),[ch,cm]=String(h.hasta||'22:00').split(':').map(Number);
  const start=ah*60+am,end=ch*60+cm,open=end>start ? minutes>=start&&minutes<end : minutes>=start||minutes<end;
  return {abierto:open,texto:open?`Abierto ahora · hasta ${h.hasta}`:`Cerrado · abrimos a las ${h.desde}`,proxima:open?'':proximaApertura(now)};
}
function proximaApertura(now=new Date(new Date().toLocaleString('en-US',{timeZone:'America/Bogota'}))){
  const keys=['domingo','lunes','martes','miercoles','jueves','viernes','sabado'], all=horario();
  for(let d=0;d<8;d++){
    const key=keys[(now.getDay()+d)%7],h=all[key];
    if(!h?.abierto) continue;
    const [hh,mm]=String(h.desde||'17:00').split(':').map(Number), mins=now.getHours()*60+now.getMinutes();
    if(d>0||mins<hh*60+mm) return `${d===0?'hoy':d===1?'mañana':key} a las ${h.desde}`;
  }
  return 'Consulta por WhatsApp';
}

/* SHA-256 (solo para el PIN del modo local; en Firestore usa Firebase Auth) */
function sha256(str){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const rr=(n,x)=>(x>>>n)|(x<<(32-n));
  const enc=s=>{const b=[];for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);
    if(c<128)b.push(c);else if(c<2048)b.push(192|c>>6,128|c&63);
    else if(c<55296||c>=57344)b.push(224|c>>12,128|(c>>6)&63,128|c&63);
    else{const c2=s.charCodeAt(++i);const u=0x10000+((c&0x3FF)<<10)+(c2&0x3FF);
      b.push(240|u>>18,128|(u>>12)&63,128|(u>>6)&63,128|u&63);}}return b;};
  const msg=enc(str), L=msg.length, bits=L*8, total=((L+9+63)>>6)<<6;
  const m=msg.concat([128],new Array(total-L-1).fill(0));
  const hi=Math.floor(bits/0x100000000), lo=bits>>>0;
  m[total-8]=(hi>>>24)&255;m[total-7]=(hi>>>16)&255;m[total-6]=(hi>>>8)&255;m[total-5]=hi&255;
  m[total-4]=(lo>>>24)&255;m[total-3]=(lo>>>16)&255;m[total-2]=(lo>>>8)&255;m[total-1]=lo&255;
  let h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const w=new Array(64);
  for(let i=0;i<total;i+=64){
    for(let j=0;j<16;j++) w[j]=(m[i+j*4]<<24)|(m[i+j*4+1]<<16)|(m[i+j*4+2]<<8)|m[i+j*4+3];
    for(let j=16;j<64;j++){const a=w[j-15],b=w[j-2];
      w[j]=(w[j-16]+(rr(7,a)^rr(18,a)^(a>>>3))+w[j-7]+(rr(17,b)^rr(19,b)^(b>>>10)))|0;}
    let [a1,b1,c1,d1,e1,f1,g1,h1]=h;
    for(let j=0;j<64;j++){
      const S1=rr(6,e1)^rr(11,e1)^rr(25,e1), ch=(e1&f1)^(~e1&g1), t1=(h1+S1+ch+K[j]+w[j])|0;
      const S0=rr(2,a1)^rr(13,a1)^rr(22,a1), mj=(a1&b1)^(a1&c1)^(b1&c1), t2=(S0+mj)|0;
      h1=g1;g1=f1;f1=e1;e1=(d1+t1)|0;d1=c1;c1=b1;b1=a1;a1=(t1+t2)|0;
    }
    h=[(h[0]+a1)|0,(h[1]+b1)|0,(h[2]+c1)|0,(h[3]+d1)|0,(h[4]+e1)|0,(h[5]+f1)|0,(h[6]+g1)|0,(h[7]+h1)|0];
  }
  return h.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}

/* ═══════════════ CAPA DE DATOS ═══════════════
   Dos backends con la misma interfaz:
     · firestore → nube, se ve desde cualquier dispositivo, en vivo
     · local     → localStorage, por si aún no hay config
*/
const Store = {
  mode: USE_FIREBASE ? 'firestore' : 'local',
  fb:null, fdb:null, fauth:null,

  async init(){
    if(this.mode === 'firestore'){ await this.initFirestore(); }
    else { await this.initLocal(); }
    Object.keys(cart).forEach(id => { if(!prod(id)) delete cart[id]; });
    saveCart();
    S.ready = true;
  },

  /* ---------- FIREBASE ---------- */
  async initFirestore(){
    try{
      await new Promise((ok,no) => {
        let n = 0, settled = false;
        const fail = m => { if(!settled){ settled = true; no(new Error(m)); } };
        /* si el CDN se queda colgado, no bloqueamos la tienda entera */
        const timer = setTimeout(() => fail('Firebase tardó demasiado en cargar'), 12000);
        const done = () => { if(++n === 3 && !settled){ settled = true; clearTimeout(timer); ok(); } };
        for(const f of ['firebase-app-compat.js','firebase-firestore-compat.js','firebase-auth-compat.js']){
          const s = document.createElement('script');
          s.src = SDK + f; s.async = true;
          s.onload = done;
          s.onerror = () => { clearTimeout(timer); fail('No se pudo descargar ' + f + ' (revisa tu conexión)'); };
          document.head.appendChild(s);
        }
      });
      this.fb = firebase.initializeApp(firebaseConfig);
      this.fdb = firebase.firestore();
      this.fauth = firebase.auth();
      this.fdb.settings({ ignoreUndefinedProperties: true });

      /* Las reglas solo permiten escribir el catálogo siendo admin, así
         que la siembra NO puede hacerse aquí (aún no hay sesión): antes
         esto lanzaba permission-denied y toda la app caía a modo local.
         Ahora se espera a la sesión y se siembra en maybeSeed(). */
      await new Promise(ok => {
        this.fauth.onAuthStateChanged(u => {
          S.user = u;
          const was = adminOK;
          adminOK = !!u;
          const after = (u && isAdmin)
            ? this.maybeSeed().catch(err => console.warn('siembra:', err))
            : Promise.resolve();
          after.then(async () => {
            if(u && isAdmin){
              await this.loadMaterials(); await this.loadStock();
              await this.loadCompras(); await this.loadGastos();
              render(); startWatch(); if(!was) toast('Sesión iniciada: ' + (u.email||''));
            }
            if(!u && isAdmin){ adminOK = false; render(); }
            ok();
          });
        });
      });
    }catch(e){
      this.mode = 'local'; S.initError = e.message || String(e);
      await this.initLocal();
      toast('Sin conexión a Firebase: modo local', 'err');
    }
  },

  /* Siembra inicial: solo la hace el administrador ya autenticado,
     porque las reglas exigen ser admin para escribir catálogo/config.
     Se ejecuta una sola vez (si config/main no existe todavía). */
  async maybeSeed(){
    if(this.mode !== 'firestore' || !this.fauth.currentUser) return;
    const cfgRef = this.fdb.collection('config').doc('main');
    const snap = await cfgRef.get();
    S.cfg={...(snap.exists?snap.data():{}),pago:PAGO_DEF};
    if(snap.exists){
      if(snap.data()?.pago) await cfgRef.update({pago:firebase.firestore.FieldValue.delete()});
      return;
    }
    const batch=this.fdb.batch();
    batch.set(cfgRef,{negocio:NEGOCIO_DEF,horario:HORARIO_DEF});
    await batch.commit();
  },

  /* ---------- LOCAL ---------- */
  async initLocal(){
    let raw = null;
    try { raw = JSON.parse(localStorage.getItem(KLOCAL) || 'null'); } catch(e){}
    S.materials = Array.isArray(raw?.materials)
      ? raw.materials.map((m,i) => ({ id:m.id||('m'+(i+1)), ...cleanMaterial(m), ts:Number(m.ts)||0 })) : [];
    S.compras = Array.isArray(raw?.compras) ? raw.compras.map((c,i) => ({ id:c.id||('c'+(i+1)), ...cleanCompra(c), ts:Number(c.ts)||0 })) : [];
    S.gastos  = Array.isArray(raw?.gastos)  ? raw.gastos.map((g,i)  => ({ id:g.id||('g'+(i+1)),  ...cleanGasto(g),  ts:Number(g.ts)||0 }))  : [];
    S.products = Array.isArray(raw?.products) ? raw.products.map((p,i) => ({ id:p.id||('p'+(i+1)), ...clean(p), ts:Number(p.ts)||i })) : [];
    S.orders  = Array.isArray(raw?.pedidos) ? raw.pedidos : [];
    S.cfg     = raw?.cfg || { negocio:NEGOCIO_DEF, pago:PAGO_DEF };
    S.stock = {};
    if(raw?.stock && typeof raw.stock === 'object'){
      for(const [id,v] of Object.entries(raw.stock)) S.stock[id] = cleanStock(v);
    }
    adminOK = sessionStorage.getItem('gosto_admin') === '1';
    this.saveLocal();   /* deja los datos saneados (fotos, precios) ya guardados */
  },
  saveLocal(){
    try{ localStorage.setItem(KLOCAL, JSON.stringify({ products:S.products, pedidos:S.orders, cfg:S.cfg, materials:S.materials, stock:S.stock, compras:S.compras, gastos:S.gastos })); }catch(e){}
  },

  /* ---------- LECTURA ---------- */
  async loadProducts(){
    if(this.mode === 'firestore'){
      let s;
      try{ s = await this.fdb.collection('products').orderBy('ts').get(); }
      catch(e){ s = await this.fdb.collection('products').get(); }
      S.products = s.docs.map(d => ({ id:d.id, ...clean(d.data()) }));
    }
  },
  async loadConfig(){
    if(this.mode === 'firestore'){
      try{
        const s = await this.fdb.collection('config').doc('main').get();
        S.cfg = (s.exists ? s.data() : null) || { negocio:NEGOCIO_DEF, horario:HORARIO_DEF };
      }catch(e){
        console.warn('No se pudo leer la configuración pública:',e);
        S.cfg={negocio:NEGOCIO_DEF,horario:HORARIO_DEF};
      }
      S.cfg.pago=PAGO_DEF;
    }
  },
  loadOrders(){ return Promise.resolve(S.orders); },

  /* ---------- LECTURA: inventario (solo admin) ---------- */
  async loadMaterials(){
    if(this.mode !== 'firestore' || !adminOK) return;
    try{
      let s;
      try{ s = await this.fdb.collection('materiasPrimas').orderBy('ts').get(); }
      catch(e){ s = await this.fdb.collection('materiasPrimas').get(); }
      S.materials = s.docs.map(d => ({ id:d.id, ...cleanMaterial(d.data()), ts:Number(d.data().ts)||0 }));
      if(!s.size){
        /* compatibilidad con colección anterior */
        try{
          let s2 = await this.fdb.collection('materials').get();
          if(s2.size) S.materials = s2.docs.map(d => ({ id:d.id, ...cleanMaterial(d.data()), ts:Number(d.data().ts)||0 }));
        }catch(e2){}
      }
      /* recalcular costos de productos con recetas según costos actuales */
      S.products = S.products.map(p => ({ id:p.id, ts:p.ts, ...clean(p) }));
    }catch(e){ console.warn('No se pudieron leer los insumos:', e); }
  },
  async loadCompras(){
    if(this.mode !== 'firestore' || !adminOK) return;
    try{
      let s;
      try{ s = await this.fdb.collection('compras').orderBy('ts','desc').get(); }
      catch(e){ try{ s = await this.fdb.collection('compras').orderBy('fecha','desc').get(); }catch(e2){ s = await this.fdb.collection('compras').get(); } }
      S.compras = s.docs.map(d => ({ id:d.id, ...cleanCompra(d.data()), ts:Number(d.data().ts)||0 }));
    }catch(e){ console.warn('No se pudieron leer las compras:', e); S.compras = S.compras || []; }
  },
  async loadGastos(){
    if(this.mode !== 'firestore' || !adminOK) return;
    try{
      let s;
      try{ s = await this.fdb.collection('gastos').orderBy('ts','desc').get(); }
      catch(e){ try{ s = await this.fdb.collection('gastos').orderBy('fecha','desc').get(); }catch(e2){ s = await this.fdb.collection('gastos').get(); } }
      S.gastos = s.docs.map(d => ({ id:d.id, ...cleanGasto(d.data()), ts:Number(d.data().ts)||0 }));
    }catch(e){ console.warn('No se pudieron leer los gastos:', e); S.gastos = S.gastos || []; }
  },
  async loadStock(){
    if(this.mode === 'firestore'){
      try{
        const s = await this.fdb.collection('stock').get();
        const next = {};
        s.docs.forEach(d => { next[d.id] = cleanStock(d.data()); });
        S.stock = next;
      }catch(e){ console.warn('No se pudo leer el inventario:', e); }
    }
    /* en modo local el inventario ya viene de localStorage */
  },

  /* pedidos en vivo */
  watchOrders(cb){
    if(this.mode === 'firestore'){
      if(this.unsub) this.unsub();
      this.unsub = this.fdb.collection('orders').orderBy('ts','desc').onSnapshot(
        snap => {
          S.ordersError = '';
          S.orders = snap.docs.map(d => ({ id:d.id, ...d.data() }));
          cb(S.orders);
        },
        err => {
          console.warn('orders snapshot:', err);
          S.ordersError = (err && (err.message || err.code || String(err))) || 'No se pudieron leer los pedidos';
          if(isAdmin && adminOK) toast('⚠ Error al leer pedidos: ' + S.ordersError, 'err');
          cb([]);
        }
      );
    } else {
      cb(S.orders);
      this._localCb = cb;
    }
  },
  notifyLocal(){ if(this._localCb) this._localCb(S.orders); },

  /* ---------- ESCRITURA: productos ---------- */
  async saveProduct(p){
    const data = clean(p);
    if(this.mode === 'firestore'){
      const isNew = !p.id;
      if(isNew) p.id = this.fdb.collection('products').doc().id;
      await this.fdb.collection('products').doc(p.id).set({ ...data, ts: p.ts ?? Date.now() }, { merge:true });
    } else {
      if(!p.id) p.id = 'p' + uid();
      const i = S.products.findIndex(x => x.id === p.id);
      const rec = { ...p, ...data, id:p.id };
      if(i >= 0) S.products[i] = rec; else S.products.push(rec);
      this.saveLocal();
    }
    return p.id;
  },
  async deleteProduct(id){
    if(this.mode === 'firestore'){
      await this.fdb.collection('products').doc(id).delete();
      try{ await this.fdb.collection('stock').doc(id).delete(); }catch(e){}
    } else {
      S.products = S.products.filter(p => p.id !== id);
      delete S.stock[id];
      this.saveLocal();
    }
    delete cart[id]; saveCart();
  },

  /* ---------- ESCRITURA: materia prima, compras y gastos ---------- */
  async saveMaterial(m){
    const data = cleanMaterial(m);
    if(!m.id) m.id = this.mode === 'firestore' ? this.fdb.collection('materiasPrimas').doc().id : 'm' + uid();
    const rec = { id:m.id, ...data, ts: Number(m.ts) || Date.now() };
    if(this.mode === 'firestore'){
      await this.fdb.collection('materiasPrimas').doc(m.id).set({ ...data, ts:rec.ts }, { merge:true });
    }
    const i = S.materials.findIndex(x => x.id === m.id);
    if(i >= 0) S.materials[i] = rec; else S.materials.push(rec);
    if(this.mode !== 'firestore') this.saveLocal();
    return m.id;
  },
  async deleteMaterial(id){
    if(this.mode === 'firestore'){
      try{ await this.fdb.collection('materiasPrimas').doc(id).delete(); }catch(e){}
      try{ await this.fdb.collection('materials').doc(id).delete(); }catch(e){}
    }
    S.materials = S.materials.filter(m => m.id !== id);
    /* quita el insumo de las recetas de productos */
    const affected = S.products.filter(p => (p.receta||[]).some(r => (r.materiaPrimaId||r.mid) === id));
    for(const p of affected){
      const receta = (p.receta||[]).filter(r => (r.materiaPrimaId||r.mid) !== id);
      const costo = receta.length ? receta.reduce((s,r)=> s + matCostoUnit(mat(r.materiaPrimaId||r.mid)) * (r.cantidad||r.qty||0), 0) : (p.costo||0);
      await this.saveProduct({ ...p, receta, costo });
    }
    /* limpia recetas legacy en stock */
    const legacy = Object.keys(S.stock).filter(pid => (S.stock[pid].recipe||[]).some(r => r.mid === id || r.materiaPrimaId === id));
    for(const pid of legacy){
      await this.saveStock(pid, { qty:stockQty(pid), recipe:(S.stock[pid].recipe||[]).filter(r => r.mid !== id && r.materiaPrimaId !== id) });
    }
    if(this.mode !== 'firestore') this.saveLocal();
  },
  async saveCompra(c){
    const matId = String(c.materiaPrimaId || '').slice(0,40);
    const m = mat(matId);
    if(!m) throw new Error('Materia prima no encontrada');
    const presentaciones = Math.max(0, Number(c.presentaciones) || 0);
    const cantidadTotal = presentaciones * matPresCant(m);
    const costoTotal = Math.max(0, Math.round(Number(c.costoTotal) || 0));
    const costoUnitario = cantidadTotal > 0 ? costoTotal / cantidadTotal : matCostoUnit(m);
    let fecha = c.fecha;
    try { fecha = fecha ? new Date(fecha).toISOString().slice(0,10) : new Date().toISOString().slice(0,10); } catch(e){ fecha = new Date().toISOString().slice(0,10); }
    const compraData = cleanCompra({
      fecha, materiaPrimaId:matId, nombre:matNombre(m),
      presentaciones, cantidadTotal, costoTotal, costoUnitario,
      proveedor:c.proveedor, creadoPor: S.user?.email || 'admin',
    });
    const gastoData = cleanGasto({
      fecha, concepto:`Compra: ${matNombre(m)}`, categoria:'Materia prima',
      valor:costoTotal, creadoPor:S.user?.email || 'admin',
    });
    const stockActual = matStock(m);
    const costoActual = matCostoUnit(m);
    const nuevoStock = stockActual + cantidadTotal;
    const nuevoCosto = nuevoStock > 0 ? ((stockActual * costoActual) + costoTotal) / nuevoStock : costoUnitario;
    const matUpdate = { costoUnitario:nuevoCosto, stock:nuevoStock };

    if(this.mode === 'firestore'){
      const compraRef = this.fdb.collection('compras').doc();
      const gastoRef  = this.fdb.collection('gastos').doc();
      const matRef    = this.fdb.collection('materiasPrimas').doc(matId);
      const batch = this.fdb.batch();
      batch.set(compraRef, { ...compraData, ts:Date.now() });
      batch.set(gastoRef,  { ...gastoData, compraId:compraRef.id, ts:Date.now() });
      batch.set(matRef, { ...matUpdate }, { merge:true });
      await batch.commit();
      compraData.id = compraRef.id; compraData.ts = Date.now();
      gastoData.id = gastoRef.id; gastoData.ts = Date.now(); gastoData.compraId = compraRef.id;
      // actualizar local material
      Object.assign(m, cleanMaterial({ ...m, ...matUpdate }));
    } else {
      compraData.id = 'c' + uid(); compraData.ts = Date.now();
      gastoData.id = 'g' + uid(); gastoData.ts = Date.now(); gastoData.compraId = compraData.id;
      Object.assign(m, cleanMaterial({ ...m, ...matUpdate }));
      S.compras.unshift({ id:compraData.id, ...compraData });
      S.gastos.unshift({ id:gastoData.id, ...gastoData });
    }
    // recalcular costo de productos que usan esta materia prima
    await this.recalcProductCosts([matId]);
    if(this.mode === 'firestore'){
      await this.loadMaterials(); await this.loadCompras(); await this.loadGastos(); await this.loadProducts();
    } else {
      this.saveLocal();
    }
    return compraData.id;
  },
  async deleteCompra(id){
    const c = S.compras.find(x => x.id === id);
    if(this.mode === 'firestore'){
      const batch = this.fdb.batch();
      batch.delete(this.fdb.collection('compras').doc(id));
      const gasto = S.gastos.find(g => g.compraId === id);
      if(gasto) batch.delete(this.fdb.collection('gastos').doc(gasto.id));
      await batch.commit();
    }
    S.compras = S.compras.filter(x => x.id !== id);
    S.gastos  = S.gastos.filter(g => g.compraId !== id);
    if(this.mode !== 'firestore') this.saveLocal();
  },
  async saveGasto(g){
    const data = cleanGasto({ ...g, creadoPor: (S.user?.email || g?.creadoPor || 'admin') });
    const id = (this.mode === 'firestore' ? this.fdb.collection('gastos').doc().id : 'g' + uid());
    const rec = { id, ...data, ts: Date.now() };
    if(this.mode === 'firestore'){
      await this.fdb.collection('gastos').doc(id).set({ ...data, ts: rec.ts }, { merge: true });
    } else {
      S.gastos.push(rec);
      this.saveLocal();
    }
    S.gastos = [rec, ...S.gastos.filter(x => x.id !== id)];
    return id;
  },
  async deleteGasto(id){
    if(this.mode === 'firestore'){ try{ await this.fdb.collection('gastos').doc(id).delete(); }catch(e){} }
    S.gastos = S.gastos.filter(x => x.id !== id);
    if(this.mode !== 'firestore') this.saveLocal();
  },
  async recalcProductCosts(matIds){
    const ids = Array.isArray(matIds) ? matIds : null;
    const affected = S.products.filter(p => {
      const rec = p.receta || [];
      if(!rec.length) return false;
      return !ids || rec.some(r => ids.includes(r.materiaPrimaId || r.mid));
    });
    for(const p of affected){
      const receta = cleanRecipe(p.receta);
      const costo = receta.reduce((s,r)=> s + matCostoUnit(mat(r.materiaPrimaId)) * r.cantidad, 0);
      const updated = { ...p, receta, costo };
      if(this.mode === 'firestore'){
        await this.fdb.collection('products').doc(p.id).set({ costo, receta, ts: p.ts || Date.now() }, { merge:true });
        const i = S.products.findIndex(x=>x.id===p.id);
        if(i>=0) S.products[i] = clean({ ...S.products[i], ...updated });
      } else {
        const i = S.products.findIndex(x=>x.id===p.id);
        if(i>=0) S.products[i] = clean({ ...S.products[i], ...updated });
      }
    }
    if(this.mode !== 'firestore') this.saveLocal();
  },
  async saveStock(productId, patch){
    const data = cleanStock({ ...stockOf(productId), ...patch });
    if(this.mode === 'firestore'){
      await this.fdb.collection('stock').doc(productId).set({ qty:data.qty, recipe:data.recipe, ts:data.ts }, { merge:true });
    }
    S.stock[productId] = data;
    if(this.mode !== 'firestore') this.saveLocal();
    return data;
  },

  /* ---------- ESCRITURA: pedidos ---------- */
  async createOrder(o){
    const rec = { ...o, ts:o.ts ?? Date.now() };
    if(this.mode === 'firestore'){
      /* folio correlativo con transacción (no se repite ni con pedidos simultáneos) */
      const cRef = this.fdb.collection('config').doc('folio');
      const oRef = this.fdb.collection('orders').doc();
      try{
        await this.fdb.runTransaction(async tx => {
          const c = await tx.get(cRef);
          const next = ((c.exists ? c.data().n : 0) || 1000) + 1;
          rec.folio = next;
          tx.set(cRef, { n:next });
          tx.set(oRef, rec);
        });
      }catch(err){
        /* si las reglas del folio no estan publicadas aun, no bloqueamos el pedido */
        console.warn('folio:', err);
        rec.folio = 1000 + Math.floor(Math.random()*9000);
        await oRef.set(rec);
      }
      rec.id = oRef.id;
    } else {
      rec.id = uid();
      rec.folio = 1000 + Math.floor(Math.random()*9000);
      S.orders.unshift(rec);
      this.saveLocal(); this.notifyLocal();
    }
    return rec;
  },
  async updateOrder(id, patch){
    if(this.mode === 'firestore') await this.fdb.collection('orders').doc(id).update(patch);
    else {
      const o = S.orders.find(x => x.id === id);
      if(o) Object.assign(o, patch);
      this.saveLocal(); this.notifyLocal();
    }
  },
  async deleteOrder(id){
    if(this.mode === 'firestore') await this.fdb.collection('orders').doc(id).delete();
    else { S.orders = S.orders.filter(o => o.id !== id); this.saveLocal(); this.notifyLocal(); }
  },

  /* ---------- CONFIG ---------- */
  async saveConfig(patch){
    S.cfg = { ...S.cfg, ...patch };
    if(this.mode === 'firestore'){
      await this.fdb.collection('config').doc('main').set({negocio:S.cfg.negocio,horario:S.cfg.horario,pago:firebase.firestore.FieldValue.delete()},{merge:true});
    }
    else this.saveLocal();
  },

  /* ---------- RESPALDO ---------- */
  exportJSON(){
    return JSON.stringify({ __gosto:'export', v:2, exported:new Date().toISOString(), config:S.cfg, products:S.products, pedidos:S.orders, materiasPrimas:S.materials, compras:S.compras, gastos:S.gastos, stock:S.stock }, null, 2);
  },
  async importJSON(text){
    const d = JSON.parse(text);
    if(!Array.isArray(d.products)) throw new Error('El archivo no tiene una lista de productos');
    const pidMap = {}, midMap = {};
    const prodIds = d.products.map((p,i) => {
      const id = norm(p.id) || ('im'+i);
      if(p.id != null) pidMap[String(p.id)] = id;
      return id;
    });
    const mats = Array.isArray(d.materiasPrimas) ? d.materiasPrimas : (Array.isArray(d.materials) ? d.materials : []);
    const matIds = mats.map((m,i) => {
      const id = norm(m.id) || ('m'+(i+1));
      if(m.id != null) midMap[String(m.id)] = id;
      return id;
    });
    const remapRecipe = recipe => cleanRecipe(recipe).map(r => ({ ...r, materiaPrimaId: midMap[r.materiaPrimaId||r.mid] || r.materiaPrimaId || r.mid })).filter(r => r.materiaPrimaId);
    const stockEntries = (d.stock && typeof d.stock === 'object') ? Object.entries(d.stock) : [];
    const compras = Array.isArray(d.compras) ? d.compras : [];
    const gastos  = Array.isArray(d.gastos)  ? d.gastos  : [];
    if(this.mode === 'firestore'){
      const batch = this.fdb.batch();
      d.products.forEach((p,i) => {
        const rp = { ...p, receta: remapRecipe(p.receta || p.recipe) };
        batch.set(this.fdb.collection('products').doc(prodIds[i]), { ...clean(rp), ts:i });
      });
      mats.forEach((m,i) => batch.set(this.fdb.collection('materiasPrimas').doc(matIds[i]), { ...cleanMaterial(m), ts:i+1 }));
      stockEntries.forEach(([pid,v]) => {
        const npid = pidMap[pid] || norm(pid);
        if(!npid) return;
        batch.set(this.fdb.collection('stock').doc(npid), cleanStock({ ...v, recipe:remapRecipe(v.recipe), ts:Number(v.ts)||Date.now() }));
      });
      compras.forEach((c,i) => batch.set(this.fdb.collection('compras').doc(norm(c.id)||('c'+i)), { ...cleanCompra(c), ts:Number(c.ts)||i+1 }));
      gastos.forEach((g,i)  => batch.set(this.fdb.collection('gastos').doc(norm(g.id)||('g'+i)),  { ...cleanGasto(g),  ts:Number(g.ts)||i+1 }));
      if(d.config) batch.set(this.fdb.collection('config').doc('main'), { negocio:{...NEGOCIO_DEF,...d.config.negocio}, horario:{...HORARIO_DEF,...d.config.horario}, pago:firebase.firestore.FieldValue.delete() }, { merge:true });
      await batch.commit();
      await this.loadProducts(); await this.loadConfig();
      await this.loadMaterials(); await this.loadStock();
      await this.loadCompras(); await this.loadGastos();
    } else {
      S.products = d.products.map((p,i) => ({ id:prodIds[i], ...clean({ ...p, receta: remapRecipe(p.receta || p.recipe) }), ts:Number(p.ts)||i }));
      S.materials = mats.map((m,i) => ({ id:matIds[i], ...cleanMaterial(m), ts:Number(m.ts)||i+1 }));
      S.stock = {};
      stockEntries.forEach(([pid,v]) => {
        const npid = pidMap[pid] || norm(pid);
        if(npid) S.stock[npid] = cleanStock({ ...v, recipe:remapRecipe(v.recipe), ts:Number(v.ts)||Date.now() });
      });
      S.compras = compras.map((c,i) => ({ id:norm(c.id)||('c'+i), ...cleanCompra(c), ts:Number(c.ts)||i+1 }));
      S.gastos  = gastos.map((g,i)  => ({ id:norm(g.id)||('g'+i),  ...cleanGasto(g),  ts:Number(g.ts)||i+1 }));
      if(d.config) S.cfg = { negocio:{...NEGOCIO_DEF,...d.config.negocio}, horario:{...HORARIO_DEF,...d.config.horario}, pago:PAGO_DEF };
      this.saveLocal();
    }
    return d.products.length;
  },
};

/* ═══════════════ TOASTS / MODALES ═══════════════ */
function toast(msg, kind){
  const box = $('#toasts'); if(!box) return;
  const t = document.createElement('div');
  t.className = 'toast' + (kind==='err' ? ' err' : '');
  t.innerHTML = `<span class="ti">${kind==='err' ? I.x : I.check}</span><span>${esc(msg)}</span>`;
  box.appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 320); }, 2600);
}

let sheetSt = null;
function showSheet(html, opts = {}){
  closeSheet(true);
  const bg = document.createElement('div');
  bg.className = 'sheet-bg' + (opts.center ? ' center' : '');
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(opts.label||'Diálogo')}"${opts.mode?` data-mode="${esc(opts.mode)}"`:''}>
    <button class="sheet-x" data-act="close" aria-label="Cerrar">${I.x}</button>${html}</div>`;
  document.body.appendChild(bg);
  document.body.classList.add('locked');
  sheetSt = { bg, back:document.activeElement };
  bg.addEventListener('click', e => { if(e.target === bg) closeSheet(); });
  requestAnimationFrame(() => requestAnimationFrame(() => bg.classList.add('in')));
  setTimeout(() => {
    const f = bg.querySelector('.sheet input:not([type=radio]):not([type=hidden]),.sheet select,.sheet textarea,.sheet .btn');
    if(f) try{ f.focus({preventScroll:true}); }catch(e){}
  }, 90);
}
function closeSheet(instant){
  const st = sheetSt; if(!st) return;
  sheetSt = null;
  document.body.classList.remove('locked');
  const fin = () => { st.bg.remove(); if(st.back && st.back.isConnected) try{ st.back.focus({preventScroll:true}); }catch(e){} };
  if(instant){ fin(); return; }
  st.bg.classList.remove('in'); st.bg.classList.add('out');
  setTimeout(fin, 380);
}
document.addEventListener('keydown', e => {
  if(!sheetSt) return;
  if(e.key === 'Escape'){ e.preventDefault(); closeSheet(); return; }
  if(e.key !== 'Tab') return;
  const f = [...sheetSt.bg.querySelectorAll('.sheet button:not(:disabled),.sheet input:not([type=hidden]):not(:disabled),.sheet select:not(:disabled),.sheet textarea:not(:disabled),.sheet a[href]')].filter(x => x.offsetParent !== null);
  if(!f.length) return;
  const first = f[0], last = f[f.length-1];
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
});

function render(){
  const y = window.scrollY;
  const abierto=disponibilidad().abierto;
  $('#app').innerHTML = !S.ready ? bootView() : isEmployee ? employeeView() : isAdmin ? (adminOK ? adminView() : loginView()) : abierto ? storeView() : closedView();
  scrollTop(y);
  if(S.ready) afterRender();
}

let burgerTL = null, burgerIntroDone = false;
function initBurgerAnim(){
  if(burgerTL){ try{ burgerTL.scrollTrigger?.kill(); burgerTL.kill(); }catch(e){} burgerTL = null; }
  const stack = $('#burgerStack'), hero = stack?.closest('.hero');
  if(!stack || !hero || !window.gsap || !window.ScrollTrigger || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  stack.querySelectorAll('.burger-drip,.burger-drop,.burger-sauce').forEach(el=>el.remove());
  if(!stack.querySelector('.burger-dot')){
    for(let i=0;i<22;i++){
      const d=document.createElement('i'); d.className='burger-dot';
      d.style.left=(Math.random()*100)+'%'; d.style.top=(60+Math.random()*50)+'%';
      d.style.animationDuration=(9+Math.random()*10)+'s';
      d.style.animationDelay=(-Math.random()*12)+'s';
      stack.appendChild(d);
    }
  }
  if(!stack.querySelector('.burger-ly')){
    BURGER_LAYERS.forEach(l=>{
      const im=new Image(); im.className='burger-ly'; im.alt='';
      im.style.top=l.top+'%'; im.style.left=l.left+'%'; im.style.width=l.w+'%'; im.style.zIndex=l.z;
      im.src=l.src; stack.appendChild(im);
    });
  }
  const imgs=[...stack.querySelectorAll('.burger-ly')];
  gsap.registerPlugin(ScrollTrigger);
  const F=()=>stack.offsetWidth/533;
  gsap.set(stack,{clearProps:'transform,opacity'});
  stack.style.setProperty('--hint',1);
  const tl=gsap.timeline({scrollTrigger:{trigger:hero,start:'top top',
    end:()=>matchMedia('(max-width:640px)').matches?'+=140%':'+=180%',
    scrub:1.5,pin:true,invalidateOnRefresh:true}});
  imgs.forEach((im,i)=>{
    const l=BURGER_LAYERS[i];
    tl.fromTo(im,
      {x:()=>l.dx*F(), y:()=>l.dy*F(), scaleX:l.sx, scaleY:l.sy, transformOrigin:'50% 0%'},
      {x:0,y:0,scaleX:1,scaleY:1,ease:'sine.inOut',duration:0.6},0);
  });
  tl.to('.hero-in',{opacity:0,y:-40,duration:.3,ease:'sine.inOut'},0.08)
    .to(stack,{'--hint':0,duration:.2,ease:'none'},0)
    .to(stack,{scale:0.93,opacity:0,duration:0.45,ease:'sine.inOut'},0.92);
  burgerTL=tl;
  if(!burgerIntroDone){
    burgerIntroDone = true;
    gsap.from(hero.querySelectorAll('.eyebrow, h1, .hero-in>p, .hero-cta .btn, .hero-facts div'), {
      opacity:0, y:22, duration:.8, stagger:.075, ease:'power3.out', delay:.1, clearProps:'all'
    });
  }
  ScrollTrigger.refresh();
}

let menuTL = null;
function initMenuAnim(){
  if(menuTL){ try{ menuTL.scrollTrigger?.kill(); menuTL.kill(); }catch(e){} menuTL = null; }
  const grid = $('#grid'), menu = $('#menu');
  if(!grid || !menu || !window.gsap || !window.ScrollTrigger || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cards = [...grid.querySelectorAll('.card')];
  if(!cards.length) return;
  grid.classList.add('gsap-anim');

function eAddQty(id, delta){
  const p = prod(id); if(!p || !pActive(p)) return;
  const max = stockQty(id);
  const cur = Number(eCart[id])||0;
  const q = Math.max(0, cur + delta);
  if(q > 99){ toast('Máximo 99 unidades por producto','err'); return; }
  if(delta > 0 && q > max){ toast(max ? `Sin más unidades de «${p.name}» (quedan ${max})` : `«${p.name}» está agotado`, 'err'); return; }
  if(q > 0 && !eCart[id] && Object.keys(eCart).length >= 20){ toast('Máximo 20 productos por venta','err'); return; }

  refreshEmployee();
}

function syncCartBar(){

function addQty(id, d){
  const p = prod(id);
  if(!p || !p.available) return;
  if(d > 0 && stockQty(id) <= 0){ toast(`«${p.name}» está agotado`,'err'); return; }
  const MAX_ITEM = 99, MAX_CART = 20;   /* los mismos limites que las reglas de Firestore */
  const max = stockQty(id);
  const q = Math.max(0, (cart[id]||0) + d);
  if(d > 0 && q > max){ toast(max ? `Sin más unidades de «${p.name}» (quedan ${max})` : `«${p.name}» está agotado`, 'err'); return; }
  if(q > MAX_ITEM){ toast('Máximo ' + MAX_ITEM + ' unidades por producto','err'); return; }
  if(q > 0 && !cart[id] && Object.keys(cart).length >= MAX_CART){ toast('Máximo ' + MAX_CART + ' productos por pedido','err'); return; }
  if(q === 0) delete cart[id]; else cart[id] = q;
  saveCart();

  const b = document.getElementById('q-'+id);
  if(b && b.textContent != q){ b.textContent = q; b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); }
  const wrap = document.querySelector(`.qty[data-qty="${selId(id)}"]`);
  if(wrap){
    const dec = wrap.querySelector('[data-act="dec"]');
    if(dec) dec.disabled = q === 0;
    const inc = wrap.querySelector('[data-act="inc"]');
    if(inc) inc.disabled = q >= stockQty(id);
    if(d > 0){ wrap.classList.remove('added'); void wrap.offsetWidth; wrap.classList.add('added'); }
  }
  const row = document.querySelector(`.crow[data-id="${selId(id)}"]`);
  if(row){
    row.querySelector('.cq').textContent = q;
    row.querySelector('.ct').textContent = money(p.price * q);
    if(q === 0) row.remove();
  }
  const hn = $('#hdrN');
  if(hn){ hn.textContent = cartCount(); hn.dataset.empty = cartCount()?'0':'1'; hn.classList.remove('bump'); void hn.offsetWidth; hn.classList.add('bump'); }
  const cb = $('.cart-btn');
  if(cb){ cb.classList.remove('bump'); void cb.offsetWidth; cb.classList.add('bump'); }
  syncCartBar();

  const sheet = sheetSt?.bg?.querySelector('.sheet');
  if(sheet){
    const has = cartCount() > 0;
    const tot = sheet.querySelector('.total b');
    if(tot) tot.textContent = money(cartTotal());
    if(sheet.dataset.mode === 'cart' && !has){ openCart(); return; }
    const foot = sheet.querySelector('[data-cart-foot]');
    if(foot) foot.style.display = has ? '' : 'none';
  }
}

async function confirmOrder(){
  if(!disponibilidad().abierto){ toast('En este momento estamos cerrados','err'); closeSheet(); return; }
  const name = $('#f_name'), phone = $('#f_phone');
  let bad = false;
  [name,phone].forEach(el => el.classList.remove('err'));
  if(!name.value.trim()){ name.classList.add('err'); bad = true; }
  if(!phone.value.trim() || phone.value.replace(/\D/g,'').length < 7){ phone.classList.add('err'); bad = true; }
  if(bad){ toast('Completa nombre y teléfono','err'); (name.value.trim()?phone:name).focus(); return; }

  const btn = $('.sheet button[type=submit]');
  const metodo = (document.querySelector('input[name="pago"]:checked')||{}).value || 'nequi';
  const items = Object.entries(cart).map(([id,q]) => {
    const p = prod(id) || {};
    return { id, name:String(p.name||'Producto'), price:Math.max(0, Math.round(Number(p.price)||0)), qty:q };
  });

  /* validar stock antes de cobrar */
  const faltan = items.filter(i => stockQty(i.id) < i.qty);
  if(faltan.length){
    toast('No hay stock suficiente de: ' + faltan.map(i => `${i.name} (quedan ${stockQty(i.id)})`).join(', '), 'err');
    if(btn){ btn.disabled = false; btn.textContent = 'Enviar pedido'; }
    return;
  }

  if(btn){ btn.disabled = true; btn.innerHTML = `<span class="spin"></span> Enviando…`; }
  let pedido;
  try{
    pedido = await Store.createOrder({
      folio:0, date:new Date().toISOString(), ts:Date.now(),
      name:name.value.trim().slice(0,80), phone:phone.value.trim().slice(0,30),
      entrega:$('#f_entrega').value, notas:$('#f_notas').value.trim().slice(0,240),
      metodo, items, total:cartTotal(), status:'Pendiente',
    });
  }catch(e){
    console.error(e);
    if(btn){ btn.disabled = false; btn.textContent = 'Enviar pedido'; }
    const msg = (e && (e.message || String(e))) || '';
    /* Un error de permisos casi siempre significa que las REGLAS de Firestore
       no estan publicadas o el correo del admin no coincide con ellas. */
    if(/permission|insufficient/i.test(msg) || e && e.code === 'permission-denied'){
      toast('No se pudo enviar: revisa que las REGLAS de Firestore estén publicadas con tu correo exacto', 'err');
    }else{
      toast('No se pudo enviar: ' + msg, 'err');
    }
    return;
  }

  await adjustStockForOrder(items, -1);
  if(!isAdmin) renderGrid();   /* refresca badges "Agotado" tras la compra */

  cart = {}; saveCart();
  $$('.qty[data-qty]').forEach(w => {
    const b = w.querySelector('b'); if(b) b.textContent = 0;
    const d = w.querySelector('[data-act="dec"]'); if(d) d.disabled = true;
  });
  const hn = $('#hdrN'); if(hn){ hn.textContent = 0; hn.dataset.empty = '1'; }
  syncCartBar();

  const pg = (pago()[pedido.metodo]) || pago().nequi;
  showSheet(`<div class="confirm">
      <div class="ck"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="24"/><path d="M15 27l7.5 7.5L37 20"/></svg></div>
      <h2>¡Pedido recibido!</h2>
      <p>Tu número de pedido es<br><span class="folio">#${pedido.folio}</span></p>
      <div class="paybox">
        <div class="hd">${pg.ico||''} Paga por <b>${esc(pg.label)}</b></div>
        <p>Transfiere <b>${money(pedido.total)}</b> a:</p>
        <p class="own">${esc(pg.label)}: <b>${esc(pg.numero)}</b>${pg.nombre?`<br>A nombre de ${esc(pg.nombre)}`:''}</p>
      </div>
      <p>Manda el comprobante por WhatsApp para que iniciemos tu pedido al instante.</p>
      <div class="sheet-foot">
        <a class="btn gold block" href="${whatsappPedido(pedido)}" target="_blank" rel="noopener">${I.phone} Enviar comprobante por WhatsApp</a>
        <button class="btn ghost block" data-act="close">Listo, gracias</button>
      </div>
    </div>`, { label:'Pedido confirmado', center:true });
  toast('¡Pedido #' + pedido.folio + ' enviado!');
}

async function doLogin(){
  const mail = $('#lg_mail')?.value.trim(), pass = $('#lg_pass')?.value;
  const note = $('#lgNote'), gate = $('#gate');
  if(!mail || !pass){ note.hidden = false; note.textContent = 'Escribe correo y contraseña.'; return; }
  try{
    const cred = await Store.fauth.signInWithEmailAndPassword(mail, pass);
    S.user = cred.user; adminOK = true;
    await Store.loadMaterials(); await Store.loadStock();
    render(); startWatch(); toast('Sesión iniciada');
  }catch(e){
    const code = e?.code || '';
    const msg = /invalid-credential|wrong-password|user-not-found/.test(code) ? 'Correo o contraseña incorrectos.'
              : /too-many-requests/.test(code) ? 'Demasiados intentos. Espera un momento.'
              : (e.message || 'No se pudo iniciar sesión');
    gate.classList.remove('shake'); void gate.offsetWidth; gate.classList.add('shake');
    note.hidden = false; note.textContent = msg;
  }
}
function checkPin(){
  const inp = $('#pin_in'), gate = $('#gate'), note = $('#pinNote');
  const MAX = 5, LOCK = 60;
  const tries = +(sessionStorage.getItem('gosto_tries')||0);
  const until = +(sessionStorage.getItem('gosto_lock')||0);
  const left = Math.ceil((until - Date.now())/1000);
  if(left > 0){ note.hidden = false; note.textContent = `Demasiados intentos. Espera ${left}s.`; return; }
  if(sha256(inp.value) === PIN_LOCAL_SHA){
    sessionStorage.setItem('gosto_admin','1');
    sessionStorage.removeItem('gosto_tries'); sessionStorage.removeItem('gosto_lock');
    adminOK = true; render(); toast('Sesión iniciada');
  }else{
    const t = tries + 1;
    sessionStorage.setItem('gosto_tries', t);
    gate.classList.remove('shake'); void gate.offsetWidth; gate.classList.add('shake');
    inp.classList.add('err'); inp.value = ''; inp.focus();
    if(t >= MAX){ sessionStorage.setItem('gosto_lock', Date.now()+LOCK*1000); note.hidden=false; note.textContent=`Bloqueado ${LOCK}s por intentos fallidos.`; }
    else { toast(`PIN incorrecto · ${MAX-t} ${MAX-t===1?'intento':'intentos'}`,'err'); }
  }
}
async function logout(){
  try { if(Store.fauth) await Store.fauth.signOut(); } catch(e){}
  adminOK = false; watching = false;
  try { if(Store.unsub) Store.unsub(); Store.unsub = null; } catch(e){}
  sessionStorage.removeItem('gosto_admin');
  toast('Sesión cerrada');
  goStore();
}

/* ─────────── MÉTRICAS DEL DASHBOARD ─────────── */
function orderDate(o){
  const raw = o?.date;
  const d = raw?.toDate ? raw.toDate() : new Date(raw ?? (Number(o?.ts) || 0));
  return isNaN(d.getTime()) ? new Date(0) : d;
}
function orderTotal(o){
  const direct = Number(o?.total);
  if(Number.isFinite(direct) && direct >= 0) return direct;
  return (o?.items || []).reduce((s,i) => s + (Number(i.price) || 0) * (Number(i.qty) || 0), 0);
}
function orderUnits(o){
  return (o?.items || []).reduce((s,i) => s + Math.max(0, Number(i.qty) || 0), 0);
}
function orderCost(o){
  return (o?.items || []).reduce((s,i) => s + Math.max(0, Number(i.qty) || 0) * recipeCost(i.id), 0);
}
const dayKey = d => `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
function salesLastDays(n = 7){
  const now = new Date(); now.setHours(0,0,0,0);
  const buckets = [];
  for(let i = n - 1; i >= 0; i--){
    const d = new Date(now); d.setDate(d.getDate() - i);
    buckets.push({
      key: dayKey(d),
      date: d,
      label: d.toLocaleDateString('es-CO', { weekday:'short' }).replace('.', ''),
      total: 0,
    });
  }
  const index = new Map(buckets.map(b => [b.key, b]));
  S.orders.filter(o => o.status !== 'Cancelado').forEach(o => {
    const b = index.get(dayKey(orderDate(o)));
    if(b) b.total += orderTotal(o);
  });
  return buckets;
}
function dashboardStats(){
  const valid = S.orders.filter(o => o.status !== 'Cancelado');
  const now = new Date();
  const todayKey = dayKey(now);
  const sameDay = valid.filter(o => dayKey(orderDate(o)) === todayKey);
  const sameMonth = valid.filter(o => {
    const d = orderDate(o);
    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  });
  const week = salesLastDays(7);

  const total    = valid.reduce((s,o) => s + orderTotal(o), 0);
  const hoy      = sameDay.reduce((s,o) => s + orderTotal(o), 0);
  const semana   = week.reduce((s,o) => s + o.total, 0);
  const mes      = sameMonth.reduce((s,o) => s + orderTotal(o), 0);
  const gastos   = valid.reduce((s,o) => s + orderCost(o), 0);
  const unidades = valid.reduce((s,o) => s + orderUnits(o), 0);

  return {
    hoy, mes, semana, total, gastos, unidades,
    hoyPedidos: sameDay.length,
    hoyUnidades: sameDay.reduce((s,o) => s + orderUnits(o), 0),
    pedidos: valid.length,
    ganancia: total - gastos,
    margen: total ? (total - gastos) / total * 100 : 0,
    ticket: valid.length ? total / valid.length : 0,
    week,
  };
}
function topProducts(limit = 5){
  const map = new Map();
  S.orders.filter(o => o.status !== 'Cancelado').forEach(o => {
    (o.items || []).forEach(i => {
      const qty = Math.max(0, Number(i.qty) || 0);
      if(!qty) return;
      const key = i.id || ('n:' + (i.name || ''));
      const row = map.get(key) || {
        id: i.id, name: i.name || prod(i.id)?.name || 'Producto',
        qty: 0, total: 0,
      };
      row.qty += qty;
      row.total += qty * (Number(i.price) || 0);
      map.set(key, row);
    });
  });
  return [...map.values()].sort((a,b) => b.qty - a.qty || b.total - a.total).slice(0, limit);
}
function salesByEmployee(){
  const map = new Map();
  S.orders.filter(o => o.status !== 'Cancelado').forEach(o => {
    const name = String(o.employee || o.vendedor || o.empleado || 'Caja principal').trim() || 'Caja principal';
    const row = map.get(name) || { name, pedidos: 0, total: 0 };
    row.pedidos += 1;
    row.total += orderTotal(o);
    map.set(name, row);
  });
  return [...map.values()].sort((a,b) => b.total - a.total);
}
function productCosts(){
  const map = new Map();
  S.orders.filter(o => o.status !== 'Cancelado').forEach(o => {
    (o.items || []).forEach(i => {
      const qty = Math.max(0, Number(i.qty) || 0);
      if(!qty) return;
      const key = i.id || ('n:' + (i.name || ''));
      const row = map.get(key) || {
        id: i.id, name: i.name || prod(i.id)?.name || 'Producto',
        units: 0, total: 0, revenue: 0,
      };
      row.units += qty;
      row.total += qty * recipeCost(i.id);
      row.revenue += qty * (Number(i.price) || 0);
      map.set(key, row);
    });
  });
  return [...map.values()]
    .map(r => ({ ...r, unitCost: r.units ? r.total / r.units : 0 }))
    .sort((a,b) => b.total - a.total || b.units - a.units);
}
function compactMoney(n){
  const v = Math.max(0, Math.round(Number(n) || 0));
  if(v >= 1000000) return '$ ' + (v / 1000000).toFixed(v >= 10000000 ? 0 : 1).replace('.', ',') + ' M';
  if(v >= 10000) return '$ ' + Math.round(v / 1000) + ' mil';
  return money(v);
}

/* ─────────── GRÁFICAS (SVG Y CSS, SIN LIBRERÍAS) ─────────── */
function smoothPath(pts){
  if(pts.length < 2) return '';
  let d = `M${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}`;
  for(let i = 0; i < pts.length - 1; i++){
    const p0 = pts[i-1] || pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2] || p2;
    const t = 0.18;
    const c1x = p1.x + (p2.x - p0.x) * t, c1y = p1.y + (p2.y - p0.y) * t;
    const c2x = p2.x - (p3.x - p1.x) * t, c2y = p2.y - (p3.y - p1.y) * t;
    d += ` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
  }
  return d;
}
function lineChartHTML(){
  const series = salesLastDays(7);
  if(!series.some(d => d.total > 0)){
    return `<div class="chart-empty"><p>Aún no hay ventas en los últimos 7 días.</p></div>`;
  }
  const W = 640, H = 210, L = 10, R = 10, T = 16, B = 16;
  const max = Math.max(...series.map(d => d.total)) * 1.08;
  const x = i => L + i * (W - L - R) / (series.length - 1);
  const y = v => H - B - (v / max) * (H - T - B);
  const pts = series.map((d,i) => ({ x:x(i), y:y(d.total) }));
  const line = smoothPath(pts);
  const first = pts[0], last = pts[pts.length - 1];
  const area = `${line} L${last.x.toFixed(1)},${H - B} L${first.x.toFixed(1)},${H - B} Z`;
  const grid = [0, .33, .66, 1].map(f => {
    const gy = T + f * (H - T - B);
    return `<line class="line-grid" x1="${L}" y1="${gy.toFixed(1)}" x2="${W - R}" y2="${gy.toFixed(1)}"/>`;
  }).join('');
  const dots = pts.map(p => `<circle class="line-dot" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4.5"/>`).join('');
  return `<div class="line-chart">
    <svg class="line-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ventas de los últimos 7 días">
      <defs><linearGradient id="goldArea" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#F2D68F" stop-opacity=".55"/>
        <stop offset="55%" stop-color="#D0A247" stop-opacity=".22"/>
        <stop offset="100%" stop-color="#D0A247" stop-opacity="0"/>
      </linearGradient></defs>
      ${grid}
      <path class="line-area" d="${area}"/>
      <path class="line-path" d="${line}"/>
      ${dots}
    </svg>
    <div class="chart-x">${series.map(d => `<span>${esc(d.label)}</span>`).join('')}</div>
  </div>`;
}

/* ═══════════════ RENTABILIDAD ═══════════════ */
let plFilter = 'Todas';
const msOf = when => (typeof when === 'number' ? when : (Number(new Date(when).getTime()) || 0));
function plPeriodOk(when){
  if(plFilter === 'Hoy') return isTodayDate(when);
  const days = plFilter === '7 días' ? 7 : plFilter === '30 días' ? 30 : 0;
  if(!days) return true;
  return msOf(when) >= Date.now() - (days - 1) * 864e5;
}
function plOrders(){
  const done = S.orders.filter(o => o.status !== 'Cancelado');
  return done.filter(o => plPeriodOk(o.date || o.ts));
}
function plLaborEntries(){
  return S.gastos.filter(g => (g.categoria || '').toLowerCase() === 'mano de obra' && plPeriodOk(g.fecha || g.ts));
}
function plCostOf(i){
  const p = prod(i.id);
  if(!p) return 0;
  return recipeOf(p.id).length ? recipeCost(p.id) : Math.max(0, Number(p.costo) || 0);
}
function plRows(){
  const map = new Map();
  plOrders().forEach(o => (o.items||[]).forEach(i => {
    const q = Number(i.qty)||0; if(!q) return;
    const key = i.id || ('n:' + (i.name||''));
    const p = prod(i.id);
    const price = Math.max(0, Math.round(Number(i.price)||0));
    const cost = plCostOf(i);
    const r = map.get(key) || { id:i.id, name:i.name || (prod(i.id)?.name) || 'Producto', qty:0, revenue:0, costTotal:0, noReceta: !(p && recipeOf(p.id).length) };
    r.qty += q; r.revenue += q * price; r.costTotal += q * cost;
    map.set(key, r);
  }));
  return [...map.values()].map(r => ({ ...r, margin: r.revenue - r.costTotal, marginPct: r.revenue ? (r.revenue - r.costTotal) / r.revenue * 100 : 0 }))
    .sort((a,b) => b.margin - a.margin || b.revenue - a.revenue);
}
function plSummary(){
  const rows = plRows();
  const orders = plOrders().length;
  const units = rows.reduce((s,r) => s + r.qty, 0);
  const revenue = rows.reduce((s,r) => s + r.revenue, 0);
  const cogs = rows.reduce((s,r) => s + r.costTotal, 0);
  const margin = revenue - cogs;
  const laborEntries = plLaborEntries();
  const labor = laborEntries.reduce((s,g) => s + Math.max(0, Number(g.valor)||0), 0);
  const gross = margin - labor;
  return { rows, orders, units, revenue, cogs, margin, marginPct: revenue ? margin / revenue * 100 : 0, laborEntries: laborEntries.length, labor, gross, grossPct: revenue ? gross / revenue * 100 : 0 };
}
function kpisRentabilidadHTML(s = plSummary()){
  return kpi('Ingresos', money(s.revenue), `${s.orders} pedido${s.orders===1?'':'s'} en «${plFilter}»`)
       + kpi('Costo de ventas', money(s.cogs), 'Según recetas (o costo manual)')
       + kpi('Margen', money(s.margin), `${Math.round(s.marginPct)}% sobre las ventas`, 'ok')
       + kpi('Ganancia bruta', money(s.gross), `${Math.round(s.grossPct)}% tras mano de obra`, 'hero');
}

  El <b>margen por producto</b> de la tabla descuenta solo el costo de los ingredientes, no la mano de obra (el trabajo no se reparte por producto).<br>
  La <b>ganancia bruta</b> de arriba sí descuenta la mano de obra de todo lo vendido en el periodo.`;
}

function plLaborListHTML(){
  const rows = plLaborEntries().slice().sort((a,b) => String(b.fecha || '').localeCompare(String(a.fecha || '')) || ((Number(b.ts) || 0) - (Number(a.ts) || 0)));
  if(!rows.length) return `<p class="hint" style="margin-top:14px">Aún no has registrado pagos en «${esc(plFilter)}».</p>`;
  return `<div style="margin-top:14px">${rows.slice(0, 10).map(g => `
    <div class="esale">

function kpisEmpleadoHTML(){
  const done = employeeOrders().filter(o => o.status !== 'Cancelado');

  const totalHoy = hoyRows.reduce((s,o) => s + orderTotal(o), 0);
  const total = done.reduce((s,o) => s + orderTotal(o), 0);
  const unitsHoy = hoyRows.reduce((s,o) => s + (o.items||[]).reduce((n,i) => n + (Number(i.qty)||0), 0), 0);
  const ticketHoy = hoyRows.length ? totalHoy / hoyRows.length : 0;
  return kpi('Ventas vendedor hoy', money(totalHoy), `${hoyRows.length} venta${hoyRows.length===1?'':'s'} · ${unitsHoy} unidad${unitsHoy===1?'':'es'}`, 'hero')
       + kpi('Ticket promedio hoy', money(ticketHoy), 'Promedio por venta del día')
       + kpi('Ventas del vendedor', money(total), `${done.length} venta${done.length===1?'':'s'} registrada${done.length===1?'':'s'}`,'ok')

function panelEmpleado(){
  const rows = employeeOrders();
  const done = rows.filter(o => o.status !== 'Cancelado');

  /* por método de pago (histórico del vendedor) */
  const byMetodo = {};
  done.forEach(o => { const m = o.metodo || 'efectivo'; byMetodo[m] = (byMetodo[m]||0) + orderTotal(o); });
  const metodoMax = Math.max(1, ...Object.values(byMetodo));
  const metodosHTML = Object.entries(METODOS_PAGO).map(([k,v]) => {
    const monto = byMetodo[k] || 0;
    const w = Math.max(4, Math.round((monto / metodoMax) * 100));
    return `<div class="gasto-row">
      <div class="gasto-name"><b>${v.ico} ${esc(v.label)}</b>
        <span class="gasto-bar"><i style="width:${monto ? w : 0}%"></i></span>
      </div>
      <span class="gasto-val">${money(monto)}</span>
    </div>`;
  }).join('');

  /* productos que vende el empleado (unidades) */
  const byProduct = new Map();
  done.forEach(o => (o.items||[]).forEach(i => {
    const k = i.id || i.name;
    const r = byProduct.get(k) || { name: i.name || prod(i.id)?.name || 'Producto', qty: 0, total: 0 };
    const q = Number(i.qty) || 0;
    r.qty += q; r.total += q * (Number(i.price) || 0);
    byProduct.set(k, r);
  }));
  const top = [...byProduct.values()].sort((a,b) => b.qty - a.qty || b.total - a.total);
  const prodMax = Math.max(1, ...top.map(r => r.qty));
  const productosHTML = top.length
    ? `<div class="gasto-list">${top.slice(0, 10).map(r => `<div class="gasto-row">
        <div class="gasto-name"><b>${esc(r.name)}</b>
          <span>${r.qty.toLocaleString('es-CO')} unidad${r.qty===1?'':'es'} · ${money(r.total)}</span>
          <span class="gasto-bar"><i style="width:${Math.max(4, Math.round(r.qty / prodMax * 100))}%"></i></span>
        </div>
        <span class="gasto-val">${r.qty}</span>
      </div>`).join('')}</div>`
    : `<div class="chart-empty"><p>Aún no hay productos vendidos por el vendedor.</p></div>`;

  /* por vendedor */
  const bySeller = new Map();
  done.forEach(o => {
    const name = String(o.employee || o.vendedor || 'Venta mostrador').trim() || 'Venta mostrador';
    const r = bySeller.get(name) || { name, pedidos: 0, total: 0 };
    r.pedidos += 1; r.total += orderTotal(o);
    bySeller.set(name, r);
  });
  const sellers = [...bySeller.values()].sort((a,b) => b.total - a.total);
  const sellerMax = Math.max(1, ...sellers.map(r => r.total));
  const sellersHTML = sellers.length
    ? `<div class="emp-list">${sellers.map(r => `<div class="emp-row">
        <span class="emp-av">${esc((String(r.name).trim().charAt(0) || 'V').toUpperCase())}</span>
        <div class="emp-info"><b>${esc(r.name)}</b><span>${r.pedidos} venta${r.pedidos===1?'':'s'}</span>
          <span class="emp-bar"><i style="width:${Math.max(4, Math.round(r.total / sellerMax * 100))}%"></i></span>
        </div>
        <span class="emp-amt">${money(r.total)}</span>
      </div>`).join('')}</div>`
    : `<div class="chart-empty"><p>Aún no hay ventas registradas por vendedores.</p></div>`;

  /* ventas recientes */
  const recent = [...rows].sort((a,b) => (Number(b.ts)||0) - (Number(a.ts)||0)).slice(0, 25);
  const salesHTML = recent.length
    ? recent.map(o => {
        const pg = metodoInfo(o.metodo);
        const vendedor = String(o.employee || o.vendedor || 'Venta mostrador').trim() || 'Venta mostrador';
        const items = (o.items||[]).map(i => `${Number(i.qty)||0}× ${esc(i.name)}`).join(', ');
        const cancelada = o.status === 'Cancelado';
        return `<div class="esale">
          <div class="esale-info">
            <b>#${o.folio || '?'} · ${esc(vendedor)}${cancelada ? ' <span class="pill bad">Cancelada</span>' : ''}</b>
            <span>${items}</span>
            <small>${fmtDate(o.date || o.ts)}</small>
          </div>
          <div class="esale-acts">
            <span class="pill info">${pg.ico} ${esc(pg.label)}</span>
            <span class="esale-total">${money(orderTotal(o))}</span>
            <button class="mini-btn icon danger" data-act="delped" data-id="${esc(o.id)}" title="Eliminar venta" aria-label="Eliminar venta #${o.folio || '?'}">${I.trash}</button>
          </div>
        </div>`;
      }).join('')
    : `<div class="empty" style="padding:30px 10px"><span class="ico">🛍️</span><h3>Aún no hay ventas de vendedores</h3><p>Las ventas que registre el empleado desde el botón transparente aparecerán aquí.</p></div>`;

  return `
  <div class="kpis" id="kpis">${kpisEmpleadoHTML()}</div>

  <div class="dash-grid">
    <section class="acard span-12">
      <div class="acard-h">
        <div><h2>Ventas registradas por el vendedor</h2><p class="dash-sub">Las más recientes primero</p></div>
        <span class="dash-badge">${done.length} venta${done.length===1?'':'s'}</span>
      </div>
      <div class="acard-b">${salesHTML}</div>
    </section>

    <section class="acard span-7">
      <div class="acard-h">
        <div><h2>Productos que vende el empleado</h2><p class="dash-sub">Unidades acumuladas</p></div>
      </div>
      <div class="acard-b">${productosHTML}</div>
    </section>

    <section class="acard span-5">
      <div class="acard-h">
        <div><h2>Método de pago</h2><p class="dash-sub">Acumulado del vendedor</p></div>
      </div>
      <div class="acard-b"><div class="gasto-list">${metodosHTML}</div></div>
    </section>

    <section class="acard span-12">
      <div class="acard-h">
        <div><h2>Ventas por vendedor</h2><p class="dash-sub">Según el nombre registrado en el panel del vendedor</p></div>
      </div>
      <div class="acard-b">${sellersHTML}</div>
    </section>
  </div>`;
}

function invFiltered(){
  return S.products.filter(p => {
    const q = stockQty(p.id);
    return invFilter==='Bajo stock' ? (q > 0 && q <= LOW_STOCK)
      : invFilter==='Agotados' ? q <= 0
      : invFilter==='Con stock' ? q > 0
      : true;
  });
}
function invCount(v){
  return S.products.filter(p => {
    const q = stockQty(p.id);
    return v==='Bajo stock' ? (q > 0 && q <= LOW_STOCK)
      : v==='Agotados' ? q <= 0
      : v==='Con stock' ? q > 0
      : true;
  }).length;
}
function kpisInvHTML(){
  const units = S.products.reduce((s,p) => s + stockQty(p.id), 0);
  const low = S.products.filter(p => { const q=stockQty(p.id); return q>0 && q<=LOW_STOCK; }).length;
  const out = S.products.filter(p => stockQty(p.id) <= 0).length;
  const value = S.products.reduce((s,p) => s + stockQty(p.id) * (p.price||0), 0);
  return kpi('Unidades', units, `${S.products.length} producto${S.products.length===1?'':'s'}`)
       + kpi('Bajo stock', low, `≤ ${LOW_STOCK} unidades`, low?'warn':'ok')
       + kpi('Agotados', out, out?'Reponer pronto':'Todo con stock', out?'bad':'ok')
       + kpi('Valor inventario', money(value), 'A precio de venta','ok');
}

function matLow(m){ const min = matStockMin(m); return min > 0 && matStock(m) <= min; }
function kpisMatHTML(){
  const m = S.materials;
  const used = new Set();
  S.products.forEach(p => recipeOf(p.id).forEach(r => used.add(r.materiaPrimaId || r.mid)));
  const withRecipe = S.products.filter(p => recipeOf(p.id).length > 0);
  const low = m.filter(matLow).length;
  return dashKpi({ label:'Materias primas', val:m.length, icon:'leaf', cls:'kpi-units', sub:`${used.size} usadas en recetas`, pct:m.length?Math.min(100, used.size/m.length*100):0 })
       + dashKpi({ label:'Stock bajo', val:low, icon:'layers', cls: low ? 'kpi-costs' : 'kpi-sales', sub: low ? 'Revisa insumos' : 'Sin alertas', pct:m.length?Math.min(100, low/m.length*100):0 })
       + dashKpi({ label:'Compras', val:(S.compras||[]).length, icon:'receipt', sub:'Registradas', pct:Math.min(100, (S.compras||[]).length*10) })
       + dashKpi({ label:'Con receta', val:withRecipe.length, icon:'box', cls:'gain', sub:`de ${S.products.length} productos`, pct:S.products.length?withRecipe.length/S.products.length*100:0 });
}

  return S.materials.map((m,i) => {
    const uses = S.products.filter(p => recipeOf(p.id).some(r => (r.materiaPrimaId||r.mid) === m.id)).length;
    const low = matLow(m);
    const stockTxt = `${Math.round(matStock(m)*1000)/1000} ${esc(matUnidad(m))}`;
    const costoTxt = `${money(matCostoUnit(m))} / ${esc(matUnidad(m))}`;
    return `<div class="prow" style="--i:${i}">
      <div class="th ${low?'warn':'ok'}"><span class="ph">🌿</span></div>
      <div class="info"><b>${esc(matNombre(m))}</b><span class="mut">Unidad: ${esc(matUnidad(m))} · Pres.: ${matPresCant(m)} ${esc(matUnidad(m))} × ${money(matPresPrecio(m))} · ${uses} receta${uses===1?'':'s'}</span></div>
      <div class="acts">
        <span class="stk-pill ${low?'bad':'ok'}">${low?'Stock bajo':'Stock ok'}</span>
        <span class="pill" title="Stock">Stock: ${stockTxt}</span>

function hoursSummary(){
  let openDays = 0, total = 0;
  for(const h of Object.values(horario())){
    if(!h.abierto) continue;
    openDays++;
    const [a,b] = String(h.desde||'00:00').split(':').map(Number);
    const [c,d] = String(h.hasta||'00:00').split(':').map(Number);
    const s = a*60+b, e = c*60+d;
    total += e > s ? e-s : (1440-s)+e;
  }
  return { openDays, total };
}

function kpisHoursHTML(){
  const { openDays, total } = hoursSummary();
  const d = disponibilidad();
  const hh = Math.floor(total/60), mm = total%60;

       + kpi('Horas por semana', hh+(mm?` h ${mm} min`:' h'), 'Horario publicado')
       + kpi('Ahora mismo', d.abierto?'Abierto':'Cerrado', d.texto, d.abierto?'ok':'')
       + kpi('Próxima apertura', d.abierto?'—':(d.proxima||'—'), 'Hora de Colombia');
}

async function setStatus(id, st){
  try{
    const o = S.orders.find(x => x.id === id);
    const was = o?.status;
    await Store.updateOrder(id, { status:st });
    /* cancelar devuelve el stock; volver a activar lo descuenta de nuevo */
    if(st === 'Cancelado' && was !== 'Cancelado') await adjustStockForOrder(o?.items, +1);
    else if(was === 'Cancelado' && st !== 'Cancelado') await adjustStockForOrder(o?.items, -1);
    $$(`select[data-act="pedstatus"][data-id="${selId(id)}"]`).forEach(s => s.dataset.s = st);
    paintOrders();
    if(adminTab === 'empleado') render();
    toast(`#${o?o.folio:'?'} → ${st}`);
  }catch(e){ toast('No se pudo guardar: ' + (e.message||e), 'err'); }
}
async function addProduct(){
  const n = $('#pn')?.value.trim();
  if(!n){ toast('Escribe el nombre del producto','err'); $('#pn')?.focus(); return; }
  const cat = $('#pcat')?.value.trim() || 'Otros';
  const price = Math.max(0, parseInt($('#pprice')?.value,10)||0);
  const draft = {
    nombre:n, name:n, cat, desc:$('#pdesc')?.value.trim() || '',
    precio:price, price, costo:0, activo:true, available:true,
    img: normImg($('#purl')?.value) || catImg(cat),
    receta: [],
    ts:Date.now(),
  };
  openRecipeDraft(draft);
}
async function toggleProduct(id){
  const p = prod(id); if(!p) return;
  const next = !pActive(p);
  try{
    await Store.saveProduct({ ...p, activo:next, available:next });
    await refreshProducts();
    toast((p.nombre||p.name) + ' → ' + (next?'Disponible':'Agotado'));
  }catch(e){ toast('No se pudo guardar: ' + (e.message||e),'err'); }
}
async function deleteProduct(id){
  const p = prod(id); if(!p) return;
  const name = p.nombre || p.name;

async function saveRecipe(){
  const isDraft = !!recipeDraft;
  const p = recipeProduct(); if(!p) return;
  const receta = [];
  sheetSt?.bg.querySelectorAll('[data-act="recipeqty"]').forEach(inp => {
    const q = Math.max(0, Math.round((Number(String(inp.value).replace(',','.')) || 0) * 1000) / 1000);
    if(q > 0){
      const m = mat(inp.dataset.id);
      receta.push({ materiaPrimaId:inp.dataset.id, nombre: matNombre(m||{}), unidad: matUnidad(m||{}), cantidad:q });
    }
  });
  if(isDraft && !receta.length){
    toast('Agrega al menos un ingrediente para crear el producto','err');
    return;
  }
  try{
    const costo = receta.reduce((s,r)=> s + matCostoUnit(mat(r.materiaPrimaId)) * r.cantidad, 0);
    const savedId = await Store.saveProduct({ ...p, receta, costo });
    /* crea el registro de inventario si es un producto nuevo (para que las ventas lo descuenten) */
    if(isDraft && savedId && !S.stock[savedId]){ try { await Store.saveStock(savedId, { qty: 0 }); } catch(e){ console.warn('No se pudo crear el stock del producto', e); } }
    closeSheet();
    recipeDraft = null; recipeEditId = null;
    if(isDraft){
      if(Store.mode === 'firestore') await Store.loadProducts();
      render();
      toast('Producto creado con su receta');
    } else {
      await refreshProducts();
      refreshInventory(); refreshMateria();
      toast('Receta guardada');
    }
  }catch(e){ toast('No se pudo guardar la receta: ' + (e.message||e),'err'); }
}
