async function saveHorario(){
  const H={};
  for(const [dia,old] of Object.entries(horario())) H[dia]={abierto:$('#h_'+dia+'_on')?.checked??old.abierto,desde:$('#h_'+dia+'_desde')?.value||old.desde,hasta:$('#h_'+dia+'_hasta')?.value||old.hasta};
  try{
    await Store.saveConfig({ horario:H });
    render();
    toast('Horario guardado');
  }catch(e){ toast('No se pudo guardar: ' + (e.message||e),'err'); }
}
async function saveNegocio(){
  try{
    await Store.saveConfig({ negocio:{
      nombre: $('#c_name').value.trim() || 'Gosto',
      claims: $('#c_claim').value.trim(),
      wa: WHATSAPP_NEGOCIO,
    } });
    render();
    toast('Datos del negocio guardados');
  }catch(e){ toast('No se pudo guardar: ' + (e.message||e),'err'); }
}
function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type:type||'application/json' }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function backupJSON(){
  download(`gosto-respaldo-${new Date().toISOString().slice(0,10)}.json`, Store.exportJSON());
  toast('Respaldo descargado');
}
function exportCSV(){
  if(!S.orders.length) return toast('No hay pedidos para exportar','err');
  const head = ['Folio','Fecha','Cliente','Telefono','Entrega','Direccion/Notas','Pago','Items','Total','Estado'];
  const q = s => `"${String(s??'').replace(/"/g,'""')}"`;
  const rows = S.orders.map(p => [p.folio, fmtDate(p.date), p.name, p.phone, p.entrega, p.notas,
    metodoInfo(p.metodo).label, (p.items||[]).map(i=>`${i.qty}x ${i.name}`).join(' | '), p.total, p.status].map(q).join(','));
  const csv = '\uFEFF' + [head.map(q).join(','), ...rows].join('\r\n');
  download(`gosto-pedidos-${new Date().toISOString().slice(0,10)}.csv`, csv, 'text/csv;charset=utf-8;');
  toast('CSV descargado (' + S.orders.length + ' pedidos)');
}
function importJSON(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = async () => {
    const f = inp.files?.[0]; if(!f) return;
    if(!confirm('Esto reemplazará todos los productos actuales. ¿Continuar?')) return;
    try{
      const n = await Store.importJSON(await f.text());
      await refreshProducts(); render();
      toast(n + ' productos importados');
    }catch(e){ toast('Archivo inválido: ' + (e.message||e),'err'); }
  };
  inp.click();
}

/* ═══════════════ NAVEGACIÓN ═══════════════ */
function openAdminSide(){
  $('#admSide')?.classList.add('open');
  $('.adm-backdrop')?.classList.add('show');
  document.body.classList.add('locked');
}
function closeAdminSide(){
  $('#admSide')?.classList.remove('open');
  $('.adm-backdrop')?.classList.remove('show');
  if(!$('.sheet-bg')) document.body.classList.remove('locked');
}
function goStore(){
  closeAdminSide();
  isAdmin = false; isEmployee = false; adminOK = false; adminTab = 'resumen';
  sessionStorage.removeItem('gosto_admin');
  if(location.hash.startsWith('#admin') || location.hash.startsWith('#empleado')) history.replaceState(null,'',location.pathname + location.search);
  render(); scrollTop(0, true);
}
function goAdmin(){
  isAdmin = true; isEmployee = false;
  adminTab = adminTabFromHash();
  if(!location.hash.startsWith('#admin')){ location.hash = '#admin'; return; }
  render();
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  switch(act){
    case 'cat':
      if(catFilter === el.dataset.v) return;
      catFilter = el.dataset.v;
      $$('.chip[data-act="cat"]').forEach(c => c.setAttribute('aria-pressed', c.dataset.v === catFilter));
      renderGrid();
      break;
    case 'inc': addQty(el.dataset.id, 1); break;
    case 'dec': addQty(el.dataset.id, -1); break;
    case 'delitem': addQty(el.dataset.id, -cart[el.dataset.id]); break;
    case 'emp': location.hash = '#empleado'; break;
    case 'empadd': eAddQty(el.dataset.id, 1); break;
    case 'empinc': eAddQty(el.dataset.id, 1); break;
    case 'empdec': eAddQty(el.dataset.id, -1); break;
    case 'emprem': delete eCart[el.dataset.id]; refreshEmployee(); break;
    case 'empclear': eCart = {}; refreshEmployee(); break;
    case 'empmethod': {
      const m = el.dataset.method;
      eMetodo = METODOS_PAGO[m] ? m : 'efectivo';
      try { localStorage.setItem('gosto_metodo', eMetodo); } catch(e2){}
      $$('.emp-method').forEach(b => { const on = b.dataset.method === eMetodo; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
      break;
    }
    case 'empregist': await registerEmployeeSale(); break;
    case 'cart': openCart(); break;
    case 'checkout': openForm(); break;
    case 'cartcap': {
      const n = cartCapToStock();
      closeSheet();
      if(n) toast(`${n} línea${n === 1 ? '' : 's'} ajustada${n === 1 ? '' : 's'} al stock disponible`);
      openCart();
      break;
    }
    case 'close': closeSheet(); recipeDraft = null; break;
    case 'clrsearch': searchQ = ''; render(); break;
    case 'copy': {
      const v = el.dataset.v;
      const done = () => { el.innerHTML = I.check+' Copiado'; el.classList.add('done');
        setTimeout(() => { el.innerHTML = I.copy+' Copiar'; el.classList.remove('done'); }, 1600); };
      if(navigator.clipboard?.writeText) navigator.clipboard.writeText(v).then(done, done); else done();
      break;
    }
    case 'wa': {
      const n = negocio().wa || S.cfg?.lastPhone || S.orders?.[0]?.phone || '';
      window.open(n ? waLink(n) : 'https://wa.me/', '_blank', 'noopener');
      break;
    }
    case 'admin': goAdmin(); break;
    case 'store': goStore(); break;
    case 'logout': await logout(); break;
    case 'login': await doLogin(); break;
    case 'pin': checkPin(); break;

    case 'admintab': {
      const v = el.dataset.v;
      if(!v || v === adminTab) break;
      closeAdminSide();
      adminTab = v;
      if(location.hash.startsWith('#admin')) history.replaceState(null, '', '#admin' + (v==='resumen' ? '' : '/' + v));
      render(); scrollTop(0);
      break;
    }
    case 'admsideopen': openAdminSide(); break;
    case 'admside': closeAdminSide(); break;

    case 'togg': await toggleProduct(el.dataset.id); break;
    case 'delprod': await deleteProduct(el.dataset.id); break;
    case 'viewprod': openProductView(el.dataset.id); break;
    case 'editprod': openEdit(el.dataset.id); break;
    case 'saveprod': await saveProduct(); break;
    case 'addprod': await addProduct(); break;
    case 'savehours': await saveHorario(); break;
    case 'savebiz': await saveNegocio(); break;
    case 'bkjson': backupJSON(); break;
    case 'impjson': importJSON(); break;
    case 'csv': exportCSV(); break;
    case 'delped': {
      const o = S.orders.find(x => x.id === el.dataset.id);
      if(!confirm('¿Eliminar el pedido #'+(o?o.folio:'?')+'?')) return;
      try{
        await Store.deleteOrder(el.dataset.id);
        if(o && o.status !== 'Cancelado') await adjustStockForOrder(o.items, +1);
        paintOrders(); if(adminTab === 'empleado') render(); toast('Pedido eliminado');
      }
      catch(err){ toast('No se pudo eliminar: ' + (err.message||err),'err'); }
      break;
    }
    case 'filter-pl':
      plFilter = el.dataset.v;
      $$('.chip[data-act="filter-pl"]').forEach(c => c.setAttribute('aria-pressed', c.dataset.v === plFilter));
      refreshPL();
      break;
    case 'addlabor': {
      const fecha = $('#laborFecha')?.value;
      const valor = Math.max(0, Math.round(Number(String($('#laborValor')?.value||'').replace(',','.')) || 0));
      const nota = ($('#laborNota')?.value || '').trim().slice(0,80);
      if(!fecha){ toast('Selecciona el día del pago','err'); return; }
      if(!valor){ toast('Escribe el monto del pago','err'); $('#laborValor')?.focus(); return; }
      try{
        await Store.saveGasto({ fecha, concepto: nota ? `Mano de obra: ${nota}` : 'Mano de obra', categoria:'Mano de obra', valor, creadoPor: S.user?.email || 'admin' });
        refreshPL();
        toast('Pago registrado');
      }catch(e){ toast('No se pudo registrar el pago: ' + (e.message||e), 'err'); }
      break;
    }
    case 'dellabor': {
      if(!confirm('¿Borrar este pago de mano de obra?')) break;
      try{ await Store.deleteGasto(el.dataset.id); refreshPL(); toast('Pago eliminado'); }
      catch(err){ toast('No se pudo eliminar: ' + (err.message||err), 'err'); }
      break;
    }
    case 'filter-status':
      ordFilter = el.dataset.v;
      $$('.chip[data-act="filter-status"]').forEach(c => c.setAttribute('aria-pressed', c.dataset.v === ordFilter));
      paintOrders();
      break;

    /* inventario y materia prima */
    case 'invplus': await changeStock(el.dataset.id, 1); break;
    case 'invminus': await changeStock(el.dataset.id, -1); break;
    case 'filter-inv':
      invFilter = el.dataset.v;
      $$('.chip[data-act="filter-inv"]').forEach(c => c.setAttribute('aria-pressed', c.dataset.v === invFilter));
      refreshInventory();
      break;
    case 'addmat': await addMaterial(); break;
    case 'delmat': await removeMaterial(el.dataset.id); break;
    case 'editmat': openMatEdit(el.dataset.id); break;
    case 'savemat': await saveMat(); break;
    case 'addcompra': await addCompra(); break;
    case 'delcompra': await deleteCompra(el.dataset.id); break;
    case 'recipe': openRecipe(el.dataset.id); break;
    case 'recipeview': openRecipe(el.dataset.id); break;
    case 'saverecipe': await saveRecipe(); break;
    case 'gotomateria':
      closeSheet(true);
      recipeDraft = null;
      closeAdminSide();
      adminTab = 'materia';
      if(location.hash.startsWith('#admin')) history.replaceState(null, '', '#admin/materia');
      render(); scrollTop(0);
      break;
  }
});

function renderGrid(){
  if(isAdmin){ if(adminOK) paintOrders(); return; }
  const grid = $('#grid'); if(!grid) return;
  const list = visible();
  grid.classList.remove('enter'); void grid.offsetWidth; grid.classList.add('enter');
  grid.innerHTML = list.length ? list.map((p,i)=>card(p,i)).join('') : `
    <div class="empty"><span class="ico">🍽️</span><h3>Nada por aquí</h3>
    <p>${searchQ ? `No hay resultados para “${esc(searchQ)}”.` : 'Esta categoría está vacía por ahora.'}</p></div>`;
  if(S.ready&&!isAdmin&&!isEmployee) initMenuAnim();
}

/* input: buscador, precio, archivo */
document.addEventListener('input', e => {
  if(e.target.id === 'q'){
    searchQ = e.target.value;
    e.target.closest('.search').classList.toggle('has', !!searchQ);
    renderGrid();
  }
  if(e.target.dataset?.act === 'pinprod'){
    const val = Math.max(0, parseInt(e.target.value,10)||0);
    e.target.value = val;
    e.target.classList.add('edited');
    clearTimeout(e.target._t);
    e.target._t = setTimeout(() => e.target.classList.remove('edited'), 900);
    clearTimeout(e.target._p);
    e.target._p = setTimeout(() => savePrice(e.target.dataset.id, val), 600);
  }
  if(e.target.dataset?.act === 'invqty'){
    const id = e.target.dataset.id;
    const val = Math.max(0, parseInt(e.target.value,10)||0);
    e.target.value = val;
    S.stock[id] = cleanStock({ ...stockOf(id), qty:val });
    e.target.classList.add('edited');
    clearTimeout(e.target._t);
    e.target._t = setTimeout(() => e.target.classList.remove('edited'), 900);
    clearTimeout(e.target._p);
    e.target._p = setTimeout(() => saveStockQty(id, val), 600);
  }
  if(e.target.dataset?.act === 'recipeqty') updateRecipeSummary();
  if(e.target.id === 'e_price' || e.target.id === 'e_cost') updateEditSummary();
  if(e.target.id === 'empName'){ try { localStorage.setItem('gosto_vendedor', e.target.value); } catch(e2){} }

  if(e.target.id === 'ctotal') e.target.dataset.touched = '1';
  if(e.target.dataset?.act === 'compra-calc') updateCompraHint();
});

/* change: estado del pedido, etiqueta de entrega */
document.addEventListener('change', e => {
  const el = e.target.closest?.('[data-act]');
  if(el?.dataset.act === 'pedstatus') setStatus(el.dataset.id, el.value);
  if(e.target.id === 'f_entrega'){
    const isDom = e.target.value === 'Domicilio';
    const l = $('#wrapNotas')?.querySelector('label');
    if(l) l.textContent = isDom ? 'Dirección de entrega' : 'Dirección o notas';
  }
  if(e.target.dataset?.act === 'compra-mat'){ const t = $('#ctotal'); if(t) t.dataset.touched=''; updateCompraHint(); }
});

document.addEventListener('submit', e => {
  if(e.target?.id === 'of'){ e.preventDefault(); confirmOrder(); }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && $('#admSide')?.classList.contains('open')) closeAdminSide();
  if(e.target.id === 'pin_in' && e.key === 'Enter'){ e.preventDefault(); checkPin(); }
  if((e.target.id === 'lg_mail' || e.target.id === 'lg_pass') && e.key === 'Enter'){ e.preventDefault(); doLogin(); }
});

window.addEventListener('hashchange', () => {
  const to = location.hash.startsWith('#admin');
  const toEmployee = location.hash.startsWith('#empleado');
  const tab = adminTabFromHash();
  if(to === isAdmin && toEmployee === isEmployee && (!to || tab === adminTab)) return;
  isAdmin = to;
  isEmployee = toEmployee;
  if(to) adminTab = tab;
  adminOK = S.user ? true : sessionStorage.getItem('gosto_admin') === '1';
  closeAdminSide(); closeSheet(true); render(); scrollTop(0); startWatch();
});

/* ═══════════════ ARRANQUE ═══════════════ */
/* Pedidos en vivo: en Firestore llegan solos, sin recargar.
   Solo se suscribe si el usuario es el administrador, porque las
   reglas impiden que un visitante lea la coleccion 'orders'. */
let watching = false;
function startWatch(){
  if(Store.mode !== 'firestore'){
    if(!watching){ watching = true; Store.watchOrders(() => { if(isAdmin && adminOK) paintOrders(); }); }
    return;
  }
  if(watching || !adminOK || !isAdmin) return;
  watching = true;
  Store.watchOrders(() => { if(isAdmin && adminOK) paintOrders(); });
}
(async function boot(){
  render();                                  // pantalla de carga
  await Store.init();
  await Store.loadProducts();
  await Store.loadConfig();
  await Store.loadOrders();
  adminOK = Store.mode === 'firestore' ? !!S.user : sessionStorage.getItem('gosto_admin') === '1';
  adminTab = adminTabFromHash();
  if(Store.mode !== 'firestore' || adminOK){ await Store.loadMaterials(); }
  await Store.loadStock();   /* datos públicos: stock disponible para la tienda */
  render();
  startWatch();
})();
</script></body>
